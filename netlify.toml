# Nightframe — Netlify deploy configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

# ---------------------------------------------------------------------------
# Default build settings (applies to all contexts unless overridden below)
# ---------------------------------------------------------------------------
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Public (non-secret) build-time vars go here.
  # Secret keys belong in the Netlify UI: Site → Environment variables.
  # SITE_URL is injected automatically by Netlify as URL / DEPLOY_URL.

# ---------------------------------------------------------------------------
# Deploy contexts
# ---------------------------------------------------------------------------

# Production: triggered by every push / merge to `main`
[context.production]
  command = "npm run build"

  [context.production.environment]
    NODE_ENV = "production"

# Branch deploys: any push to `develop` gets its own ephemeral URL
[context.branch-deploy]
  command = "npm run build"

  [context.branch-deploy.environment]
    NODE_ENV = "development"

# Deploy previews: auto-created for every pull-request
[context.deploy-preview]
  command = "npm run build"

  [context.deploy-preview.environment]
    NODE_ENV = "development"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
# SPA fallback — route all requests through index.html.
# Remove if using SSR or a framework with its own routing plugin.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Security & caching headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';"

# Long-lived cache for hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
